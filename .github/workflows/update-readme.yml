name: Sync Russian README with Main

on:
  push:
    paths:
      - 'docs/README.ru.md'

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy Russian README to root
        run: |
          cp docs/README.ru.md README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Sync README.md with README.ru.md"
          git push
